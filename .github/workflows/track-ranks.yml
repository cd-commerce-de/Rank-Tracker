name: Track marketplace ranks

on:
  schedule:
    # 1) Full daily check of every product + keyword.
    # (05:17 UTC rather than the busy top of the hour: GitHub starts scheduled runs late, least so at quiet minutes)
    - cron: "17 5 * * *"
    # 2) Hourly "pick-up": only checks products/keywords that were added since
    #    the last run (so new sheet rows start tracking on their own, with no
    #    button and no token). If nothing is new, the run ends in seconds.
    #    GitHub may start scheduled runs a little late.
    - cron: "20 * * * *"
  workflow_dispatch: {}   # the "Sync now" button / "Run workflow" on GitHub: a full check

permissions:
  contents: write

# Only one run at a time; a second one waits for the first to finish.
# Two runs writing ranks.json together could lose data.
concurrency:
  group: track-ranks
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      # Your products & keywords: the link(s) to your Google Sheet tab(s) (repo secret,
      # one link per line), or, if that isn't set, config/keywords.csv + config/products.csv.
      TRACKING_SHEET_CSV_URL: ${{ secrets.TRACKING_SHEET_CSV_URL }}
      # How eBay products are read when their "source" cell in the Products tab is blank:
      #   web = the real ebay.de page through Bright Data (what a German shopper sees; uses Bright Data credit)
      #   api = eBay's free search API (less faithful)
      # Write api or web in a product's source cell to override this for that product.
      EBAY_DEFAULT_SOURCE: "web"
      # "1" for any scheduled run EXCEPT the daily one => the hourly pick-up checks only
      # what's new. (Manual/Sync runs and the daily run check everything.)
      # If you change the daily time above ("17 5 * * *"), change it here too.
      ONLY_NEW: ${{ github.event_name == 'schedule' && github.event.schedule != '17 5 * * *' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Publishes the CURRENT products + keywords (with SKU and product name) as docs/data/config.json, so the
      # dashboard shows exactly what is in the sheet today. Runs on every workflow run, including the quick hourly
      # ones, so a sheet edit shows up within about an hour. Does nothing (and commits nothing) if nothing changed.
      - name: Publish the current keyword list for the dashboard
        continue-on-error: true
        run: |
          python scripts/export_config.py
          if [ -f docs/data/config.json ]; then git add docs/data/config.json; fi
          if ! git diff --staged --quiet; then
            git config user.name "rank-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update keyword list $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Check whether there is anything to do
        id: check
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_BROWSER_AUTH: ${{ secrets.BRIGHTDATA_BROWSER_AUTH }}
        run: python scripts/has_new.py

      # continue-on-error on each tracker below is deliberate: if you've only
      # set up eBay so far (or Otto/Kaufland/Bright Data secrets are missing
      # or wrong), that tracker fails but the others still run and their data
      # still gets committed, rather than one missing marketplace blocking
      # every marketplace's update. A green checkmark on this workflow does NOT
      # mean every marketplace succeeded — expand each step below to check.

      - name: Run eBay rank tracker
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python scripts/ebay_rank_tracker.py

      - name: Run eBay rank tracker (website mode)
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # Results pages read per keyword. Each page is one paid Bright Data request.
          # 1 = first page only (about 60 listings with the page size below). Raise to 2 or 3 to look deeper (costs more).
          EBAY_WEB_MAX_PAGES: "1"
          # Listings requested per results page: 60 (default, most reliable), 120 or 240. One request either way.
          EBAY_WEB_PAGE_SIZE: "60"
          # eBay rejects a share of requests at random (HTTP 403). An empty page is retried up to twice more,
          # alternating between a German country setting and none. auto (default) | country | none
          EBAY_WEB_GEO_MODE: "auto"
          # How many keyword pages are requested at the same time (1 = one after another). Same number of requests.
          EBAY_WEB_WORKERS: "3"
        run: python scripts/ebay_web_tracker.py

      - name: Run Otto rank tracker
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python scripts/otto_rank_tracker.py

      - name: Run Kaufland rank tracker
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python scripts/kaufland_rank_tracker.py

      - name: Install Playwright (client only — connects to a remote browser, no local Chromium download)
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: pip install playwright

      - name: Run Temu rank tracker
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        env:
          BRIGHTDATA_BROWSER_AUTH: ${{ secrets.BRIGHTDATA_BROWSER_AUTH }}
        run: python scripts/temu_rank_tracker.py

      - name: Commit updated rank data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "rank-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f docs/data/ranks.json ]; then echo "No data was saved in this run (nothing to commit)."; exit 0; fi
          git add docs/data/ranks.json
          if git diff --staged --quiet && [ -z "$ONLY_NEW" ]; then
            echo "::warning title=Nothing was saved::This full run did not save any new ranks. If it is the first run of the day, check that your products have the right source (blank = the EBAY_DEFAULT_SOURCE setting above; web = ebay.de page via Bright Data; api = eBay API), that the matching secrets exist, and read each tracker step's log. A second run on the same day saves nothing because everything was already checked."
          fi
          git diff --staged --quiet || {
            git commit -m "Update ranks $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          }
