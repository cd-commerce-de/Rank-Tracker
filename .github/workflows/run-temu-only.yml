name: Track Temu only (no eBay)

# Reads Temu keywords through the dedicated Temu Web Unlocker zone and saves the readings. It never touches eBay, Otto or Kaufland and
# never uses the eBay zone.
#
# MONEY: it runs by itself three times a day (see "schedule") and by hand. Every run first works out what is STILL LEFT today (UTC) with
# no request at all (scripts/temu_todo.py). A keyword that already has a valid reading today is never read again; only keywords that were
# blocked earlier today (blocked attempts are not billed) or that have not been tried yet are attempted. When nothing is left the run
# stops after that check and no Bright Data request is made. A keyword is therefore billed at most once per day.
# A new UTC day starts at 00:00 UTC (08:00 in the Philippines): then every keyword is due again.
on:
  schedule:
    # 00:30, 08:30 and 16:30 UTC = 08:30, 16:30 and 00:30 in the Philippines. Each run lasts up to about 2 hours.
    - cron: "30 0,8,16 * * *"
  workflow_dispatch:
    inputs:
      attempts:
        description: "Tries per keyword (1-12). Failed tries cost nothing, only time."
        required: false
        default: "6"
      workers:
        description: "Keywords read at the same time (1-8)"
        required: false
        default: "4"
      max_minutes:
        description: "Time budget in minutes: no new keyword is started after it (5-340)"
        required: false
        default: "120"

permissions:
  contents: write

# The same lock as the main workflow: never two runs at once, so one keyword is never read twice at the same time.
concurrency:
  group: track-ranks
  cancel-in-progress: false

jobs:
  temu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TRACKING_SHEET_CSV_URL: ${{ secrets.TRACKING_SHEET_CSV_URL }}
      RANK_STORAGE: "monthly"
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_ZONE_TEMU: ${{ secrets.BRIGHTDATA_ZONE_TEMU }}
      # a scheduled run has no inputs: the part after || is what it uses
      TEMU_ATTEMPTS: ${{ inputs.attempts || '6' }}
      TEMU_WORKERS: ${{ inputs.workers || '4' }}
      TEMU_MAX_MINUTES: ${{ inputs.max_minutes || '120' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check the Temu zone is set up
        run: |
          if [ -z "$BRIGHTDATA_ZONE_TEMU" ]; then
            echo "::error title=No Temu zone::The repository secret BRIGHTDATA_ZONE_TEMU is empty or missing. Add it (the name of your Temu Web Unlocker zone) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: What is still left to read today? (no request, no cost)
        id: todo
        run: python scripts/temu_todo.py

      - name: Run the Temu tracker
        if: steps.todo.outputs.todo != '0'
        run: python scripts/temu_rank_tracker.py

      - name: Commit the Temu readings
        if: steps.todo.outputs.todo != '0'
        run: |
          git config user.name "rank-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/data/ranks.json ]; then git add docs/data/ranks.json; fi
          if [ -d docs/data/ranks ]; then git add docs/data/ranks; fi
          if git diff --staged --quiet; then
            echo "Nothing new to save: no Temu reading changed."
            exit 0
          fi
          git commit -m "Update Temu ranks $(date -u +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3 4; do
            if git pull --rebase && git push; then
              echo "Saved the Temu readings (attempt $attempt)."
              exit 0
            fi
            echo "Saving failed on attempt $attempt, trying again in 15 seconds."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error title=Temu readings not saved::The readings could not be pushed after 4 attempts. They were paid for but are not saved, so the next run reads them again."
          exit 1

      - name: Nothing left today
        if: steps.todo.outputs.todo == '0'
        run: echo "Every Temu keyword already has a valid reading for today (UTC). No request was made, nothing was billed."
