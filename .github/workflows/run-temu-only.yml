name: Track Temu only (no eBay)

# Reads Temu keywords through the dedicated Temu Web Unlocker zone and saves the readings. It never touches eBay, Otto or Kaufland and
# never uses the eBay zone.
#
# MONEY: it has six scheduled slots a day (see "schedule") and can be started by hand. Every run first works out what is STILL LEFT today (UTC) with
# no request at all (scripts/temu_todo.py). A keyword that already has a valid reading today is never read again; only keywords that were
# blocked earlier today (blocked attempts were not billed when measured; compare the Temu zone's usage page now and then) or that have not been tried yet are attempted. When nothing is left the run
# stops after that check and no Bright Data request is made. A keyword is therefore billed at most once per day.
# A new UTC day starts at 00:00 UTC (08:00 in the Philippines): then every keyword is due again.
on:
  schedule:
    # Every 4 hours at 30 minutes past: 00:30, 04:30, 08:30, 12:30, 16:30, 20:30 UTC (08:30, 12:30, 16:30, 20:30, 00:30, 04:30 in the Philippines).
    # GitHub starts scheduled runs late and drops many of them (on 2026-11-26 only ONE of the three slots ran), so there are six slots: every run that
    # does start retries what is still blocked or untried today. A run that finds nothing left stops after the check (about 30 seconds, no request).
    - cron: "30 */4 * * *"
  workflow_dispatch:
    inputs:
      attempts:
        description: "Tries per keyword (1-12). Failed tries cost nothing, only time."
        required: false
        default: "12"
      workers:
        description: "Keywords read at the same time (1-8)"
        required: false
        default: "4"
      max_minutes:
        description: "Time budget in minutes: no new keyword is started after it (5-340)"
        required: false
        default: "120"

permissions:
  contents: write

# Its own lock: never two Temu runs at once (so one keyword is never read twice at the same time), but it neither waits for the main workflow
# (the daily eBay run) nor makes it wait: with six slots a day the Temu runs would otherwise keep the shared lock busy for most of the day.
# Saving is safe even when another workflow saves at the same moment (scripts/commit_data.sh merges the readings).
concurrency:
  group: temu-track
  cancel-in-progress: false

jobs:
  temu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TRACKING_SHEET_CSV_URL: ${{ secrets.TRACKING_SHEET_CSV_URL }}
      RANK_STORAGE: "monthly"
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_ZONE_TEMU: ${{ secrets.BRIGHTDATA_ZONE_TEMU }}
      # a scheduled run has no inputs: the part after || is what it uses
      TEMU_ATTEMPTS: ${{ inputs.attempts || '12' }}
      TEMU_WORKERS: ${{ inputs.workers || '4' }}
      TEMU_MAX_MINUTES: ${{ inputs.max_minutes || '120' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # the NEWEST main at the moment the job really starts: a run that waited for the lock, or is re-run, must not start from an older copy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check the Temu zone is set up
        run: |
          if [ -z "$BRIGHTDATA_ZONE_TEMU" ]; then
            echo "::error title=No Temu zone::The repository secret BRIGHTDATA_ZONE_TEMU is empty or missing. Add it (the name of your Temu Web Unlocker zone) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: What is still left to read today? (no request, no cost)
        id: todo
        run: python scripts/temu_todo.py

      - name: Run the Temu tracker
        if: steps.todo.outputs.todo != '0'
        run: python scripts/temu_rank_tracker.py

      - name: Commit the Temu readings
        if: steps.todo.outputs.todo != '0'
        # Saves the readings without ever losing one: if another run saved to the same history files meanwhile, the readings of both
        # are merged by content (scripts/commit_data.sh, scripts/merge_ranks.py) instead of the push failing on a Git conflict.
        run: bash scripts/commit_data.sh commit "Update Temu ranks" docs/data/ranks docs/data/ranks.json

      - name: Keep the readings if they could not be saved (download from the run page, kept 7 days)
        if: failure() && steps.todo.outputs.todo != '0'
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-temu-readings
          path: docs/data
          retention-days: 7

      - name: Nothing left today
        if: steps.todo.outputs.todo == '0'
        run: echo "Every Temu keyword already has a valid reading for today (UTC). No request was made, nothing was billed."
